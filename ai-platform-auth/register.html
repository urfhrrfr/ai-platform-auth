<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建账号 · AI助教答疑平台</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="register-page">
    <header class="brand">
      <h1>AI助教答疑平台</h1>
      <p class="brand-caption">随时提问，让学习更轻松。</p>
    </header>

    <section class="register-card" aria-labelledby="register-title">
      <header class="card-header">
        <h2 id="register-title">创建账号</h2>
      </header>

      <!-- 保留浏览器原生验证，后续接入注册接口。 -->
      <form action="#" method="post">
        <p class="form-note">以下信息均为必填项</p>
        <div class="form-grid">
          <div class="form-field">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入 2–20 个字符" minlength="2" maxlength="20" autocomplete="username" aria-describedby="username-hint" autofocus required>
            <p class="field-hint" id="username-hint">用户名长度为 2–20 个字符。</p>
          </div>
          <div class="form-field">
            <label for="identity">年级 / 身份</label>
            <select id="identity" name="identity" autocomplete="off" required>
              <option value="" disabled selected>请选择年级或身份</option>
              <option value="primary">小学生</option>
              <option value="junior">初中生</option>
              <option value="senior">高中生</option>
              <option value="university">大学生</option>
              <option value="teacher">教师</option>
              <option value="other">其他学习者</option>
            </select>
          </div>
          <div class="form-field full-width">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" placeholder="例如：name@example.com" maxlength="254" autocomplete="email" required>
          </div>
          <div class="form-field full-width">
            <label for="phone">手机号</label>
            <input type="tel" id="phone" name="phone" placeholder="例如：13812345678" minlength="11" maxlength="11" pattern="1[3-9][0-9]{9}" inputmode="numeric" autocomplete="tel-national" title="请输入 11 位中国大陆手机号，以 1 开头，第二位为 3–9" aria-describedby="phone-hint" required>
            <p class="field-hint" id="phone-hint">中国大陆手机号：11 位数字，以 1 开头，第二位为 3–9，无需填写 +86。</p>
          </div>
          <div class="form-field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入 8–64 个字符" minlength="8" maxlength="64" autocomplete="new-password" aria-describedby="password-hint" required>
          </div>
          <div class="form-field">
            <label for="confirm-password">确认密码</label>
            <input type="password" id="confirm-password" name="confirm_password" placeholder="请再次输入密码" minlength="8" maxlength="64" autocomplete="new-password" aria-describedby="password-hint password-match" required>
            <p class="validation-message" id="password-match" role="status" aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
        <p class="field-hint" id="password-hint">密码长度为 8–64 个字符，建议组合使用字母、数字和符号。</p>
        <label class="agreement" for="show-password">
          <input type="checkbox" id="show-password" name="show_password" value="yes" autocomplete="off" aria-controls="password confirm-password">
          <span>显示密码（取消勾选后隐藏）</span>
        </label>

        <label class="agreement" for="agreement">
          <input type="checkbox" id="agreement" name="agreement" value="accepted" autocomplete="off" required>
          <span>我已阅读并同意用户协议</span>
        </label>
        <button type="submit">注册账号 <span aria-hidden="true">→</span></button>
        <p class="demo-note">作业演示页面，暂未接入注册服务。</p>
      </form>
      <p class="auth-switch">已有账号？<a href="login.html">立即登录</a></p>
    </section>
    <footer class="page-footer">AI 助教 · 陪伴每一次思考</footer>
  </main>
</body>
</html>
